<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://nxrohsvtcckarurkpull.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_TjNFFVWTyk1ERcjhdCKLAw_v21E0WTF";
const FUNCTION_NAME="hyper-processor";

const $=s=>document.querySelector(s);

let movies=[];
let currentMode='discover';
let activeMovie=null;
let editingCommentId=null;
let supabaseClient=null;
let currentUser=null;
let authError='';
let authPromise=null;

function getSupabaseClient(){
  if(!window.supabase?.createClient) throw new Error('Supabase 모듈을 불러오지 못했습니다. 페이지를 새로고침해 주세요.');
  if(!SUPABASE_PUBLISHABLE_KEY || SUPABASE_PUBLISHABLE_KEY.includes('여기에_')) throw new Error('index.html에 Supabase Publishable Key를 입력해야 합니다.');
  if(!supabaseClient) supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  return supabaseClient;
}

async function ensureCommentAuth(){
  if(currentUser && supabaseClient) return currentUser;
  if(authPromise) return authPromise;
  if(authError) throw new Error(authError);

  authPromise=(async()=>{
    try{
      const client=getSupabaseClient();
      const {data:sessionData,error:sessionError}=await client.auth.getSession();
      if(sessionError) throw sessionError;
      if(sessionData.session?.user){
        currentUser=sessionData.session.user;
        return currentUser;
      }
      const {data,error}=await client.auth.signInAnonymously();
      if(error) throw error;
      currentUser=data.user;
      return currentUser;
    }catch(error){
      authError=error?.message||'익명 사용자 인증에 실패했습니다.';
      throw new Error(authError);
    }
  })();

  try{
    return await authPromise;
  }finally{
    authPromise=null;
  }
}

function setCommentNotice(message,isError=false){
  const el=$("#commentNotice");
  el.textContent=message;
  el.className=isError?'comment-message error':'comment-message';
}

function formatCommentDate(value){
  const date=new Date(value);
  return Number.isNaN(date.getTime())?'':date.toLocaleString('ko-KR',{dateStyle:'short',timeStyle:'short'});
}

function renderComments(rows){
  const list=$("#commentList");
  $("#commentCount").textContent=`${rows.length}개`;
  if(!rows.length){
    list.innerHTML='<div class="comment-empty">아직 댓글이 없습니다. 첫 감상을 남겨보세요.</div>';
    return;
  }
  list.innerHTML=rows.map(c=>{
    const mine=Boolean(currentUser && c.visitor_id===currentUser.id);
    return `<article class="comment-item">
      <div class="comment-top"><span class="comment-author">${mine?'나 · 익명':'익명'}</span><time class="comment-date">${esc(formatCommentDate(c.created_at))}${c.updated_at && c.updated_at!==c.created_at?' · 수정됨':''}</time></div>
      <div class="comment-text">${esc(c.content)}</div>
      ${mine?`<div class="comment-item-actions"><button type="button" data-comment-action="edit" data-comment-id="${esc(c.id)}">수정</button><button type="button" data-comment-action="delete" data-comment-id="${esc(c.id)}">삭제</button></div>`:''}
    </article>`;
  }).join('');
}

async function loadComments(){
  const list=$("#commentList");
  list.innerHTML='<div class="comment-empty">댓글을 불러오는 중입니다.</div>';
  try{
    await ensureCommentAuth();
    const {data,error}=await supabaseClient.from('cine_comments')
      .select('id,movie_id,movie_title,visitor_id,content,created_at,updated_at')
      .eq('movie_id',activeMovie.id)
      .order('created_at',{ascending:false})
      .limit(100);
    if(error) throw error;
    const rows=(data||[]).sort((a,b)=>{
      const aMine=a.visitor_id===currentUser.id?1:0;
      const bMine=b.visitor_id===currentUser.id?1:0;
      if(aMine!==bMine) return bMine-aMine;
      return new Date(b.created_at)-new Date(a.created_at);
    });
    renderComments(rows);
    setCommentNotice('익명으로 참여 중입니다. 본인 댓글은 위쪽에 표시되며 수정·삭제할 수 있습니다.');
  }catch(error){
    list.innerHTML='<div class="comment-empty">댓글을 표시할 수 없습니다.</div>';
    setCommentNotice(`${error.message} · Supabase의 Anonymous Sign-Ins 설정과 cine_comments 테이블/RLS를 확인하세요.`,true);
  }
}

function resetCommentEditor(){
  editingCommentId=null;
  $("#commentInput").value='';
  $("#commentSubmit").textContent='댓글 작성';
  $("#cancelCommentEdit").hidden=true;
}

async function submitComment(event){
  event.preventDefault();
  if(!activeMovie) return;
  const content=$("#commentInput").value.trim();
  if(!content){setCommentNotice('댓글 내용을 입력해 주세요.',true);return;}
  if(content.length>500){setCommentNotice('댓글은 500자 이내로 작성해 주세요.',true);return;}
  const submit=$("#commentSubmit");
  submit.disabled=true;
  try{
    await ensureCommentAuth();
    let result;
    if(editingCommentId){
      result=await supabaseClient.from('cine_comments')
        .update({content,updated_at:new Date().toISOString()})
        .eq('id',editingCommentId).eq('visitor_id',currentUser.id)
        .select('id').maybeSingle();
    }else{
      result=await supabaseClient.from('cine_comments')
        .insert({movie_id:activeMovie.id,movie_title:activeMovie.title,visitor_id:currentUser.id,content})
        .select('id').single();
    }
    if(result.error) throw result.error;
    if(editingCommentId && !result.data){throw new Error('수정 권한이 없거나 댓글이 이미 삭제되었습니다.');}
    resetCommentEditor();
    await loadComments();
  }catch(error){
    setCommentNotice(`댓글 저장 실패: ${error.message}`,true);
  }finally{
    submit.disabled=false;
  }
}

async function handleCommentAction(event){
  const button=event.target.closest('button[data-comment-action]');
  if(!button) return;
  const id=button.dataset.commentId;
  const action=button.dataset.commentAction;
  try{
    await ensureCommentAuth();
    if(action==='edit'){
      const {data,error}=await supabaseClient.from('cine_comments')
        .select('id,content').eq('id',id).eq('visitor_id',currentUser.id).maybeSingle();
      if(error) throw error;
      if(!data) throw new Error('본인이 작성한 댓글만 수정할 수 있습니다.');
      editingCommentId=id;
      $("#commentInput").value=data.content;
      $("#commentSubmit").textContent='수정 저장';
      $("#cancelCommentEdit").hidden=false;
      $("#commentInput").focus();
    }else if(action==='delete'){
      if(!confirm('이 댓글을 삭제할까요?')) return;
      const {error}=await supabaseClient.from('cine_comments').delete()
        .eq('id',id).eq('visitor_id',currentUser.id);
      if(error) throw error;
      if(editingCommentId===id) resetCommentEditor();
      await loadComments();
    }
  }catch(error){setCommentNotice(`작업 실패: ${error.message}`,true);}
}


function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function providerHtml(items, movie){
  if(!items || !items.length){
    return '<div class="none">제공 정보 없음</div>';
  }

  return '<div class="provider-list">' + items.map(p => {
    const name = esc(p.name || 'OTT');
    const logo = p.logo ? `<img src="${esc(p.logo)}" alt="">` : '';
    const content = `${logo}<span>${name}</span><span class="provider-arrow" aria-hidden="true">↗</span>`;

    // 해당 OTT의 공식 검색 페이지를 우선 사용하고, 없으면 TMDB 안내 링크를 사용합니다.
    const href = providerSearchUrl(p.name, movie) || safeHttpUrl(p.link);

    if (href) {
      return `<a class="provider" href="${esc(href)}" target="_blank" rel="noopener noreferrer" aria-label="${name}에서 ${esc(movie?.title || '영화')} 검색 (새 창)">${content}</a>`;
    }

    return `<div class="provider" title="시청 링크 정보가 없습니다.">${logo}<span>${name}</span></div>`;
  }).join('') + '</div>';
}

function providerSearchUrl(providerName, movie){
  const raw = String(providerName || '').toLowerCase().replace(/[\s+._-]/g, '');
  const title = String(movie?.title || '').trim();
  if(!title) return null;

  const q = encodeURIComponent(title);
  const providers = {
    netflix: `https://www.netflix.com/search?q=${q}`,
    '넷플릭스': `https://www.netflix.com/search?q=${q}`,
    disneyplus: `https://www.disneyplus.com/ko-kr/search?q=${q}`,
    '디즈니플러스': `https://www.disneyplus.com/ko-kr/search?q=${q}`,
    tving: `https://www.tving.com/search?query=${q}`,
    '티빙': `https://www.tving.com/search?query=${q}`,
    wavve: `https://www.wavve.com/search?searchWord=${q}`,
    wave: `https://www.wavve.com/search?searchWord=${q}`,
    '웨이브': `https://www.wavve.com/search?searchWord=${q}`,
    watcha: `https://watcha.com/search?query=${q}`,
    '왓챠': `https://watcha.com/search?query=${q}`,
    coupangplay: `https://www.coupangplay.com/search?query=${q}`,
    '쿠팡플레이': `https://www.coupangplay.com/search?query=${q}`,
    appletv: `https://tv.apple.com/kr/search?term=${q}`,
    '애플tv': `https://tv.apple.com/kr/search?term=${q}`
  };

  // provider names can include extra punctuation or spacing; use normalized aliases.
  if(raw.includes('netflix') || raw.includes('넷플릭스')) return providers.netflix;
  if(raw.includes('disney') || raw.includes('디즈니')) return providers.disneyplus;
  if(raw.includes('tving') || raw.includes('티빙')) return providers.tving;
  if(raw.includes('wavve') || raw.includes('wave') || raw.includes('웨이브')) return providers.wavve;
  if(raw.includes('watcha') || raw.includes('왓챠')) return providers.watcha;
  if(raw.includes('coupangplay') || raw.includes('쿠팡플레이')) return providers.coupangplay;
  if(raw.includes('apple') || raw.includes('애플')) return providers.appletv;
  return null;
}
function safeHttpUrl(value){
  if(!value) return null;
  try{
    const url = new URL(value);
    return url.protocol === 'https:' || url.protocol === 'http:' ? url.href : null;
  }catch{
    return null;
  }
}
function ottSummary(m){
  const names=[...(m.providers?.subscription||[]),...(m.providers?.rent||[]),...(m.providers?.buy||[])].map(x=>x.name);
  return names.length?[...new Set(names)].slice(0,4).join(' · '):'한국 OTT 정보 없음';
}
function render(){
  const grid=$("#grid");
  if(!movies.length){grid.innerHTML=`<div class="empty">${esc(emptyMessage)}</div>`;return;}
  grid.innerHTML=movies.map((m,i)=>`<article class="card" data-index="${i}">
    <div class="poster">${m.poster?`<img src="${esc(m.poster)}" alt="${esc(m.title)} 포스터" loading="lazy">`:`<div class="fallback">${esc(m.title)}</div>`}</div>
    <div class="body">
      ${m.popularViews!=null?`<div class="rank-line"><b>${i+1}위</b><span>조회 ${Number(m.popularViews).toLocaleString()}회</span></div>`:''}
      <div class="title">${esc(m.title)}</div>
      <div class="meta">${esc(m.year)} · ${esc(m.genre||'장르 정보 없음')}</div>
      <div class="ratings"><span class="pill">TMDB <b>${m.tmdb??'—'}</b></span><span class="pill">IMDb <b>${m.imdb??'—'}</b></span></div>
      <div class="ott"><b>한국 OTT</b><br>${esc(ottSummary(m))}</div>
    </div>
  </article>`).join('');
  grid.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>openDetail(movies[Number(c.dataset.index)])));
}
function recordLocalView(id){
  try{
    const a=JSON.parse(localStorage.getItem('cine_views')||'[]');
    a.push({id,at:Date.now()});
    localStorage.setItem('cine_views',JSON.stringify(a));
    return a.filter(x=>x.id===id).length;
  }catch{return 0;}
}

async function recordCineMovieView(movie){
  await ensureCommentAuth();
  const {error}=await supabaseClient.rpc('record_cine_movie_view',{
    p_movie_id:Number(movie.id),
    p_movie_data:movie
  });
  if(error) throw error;
}

function openDetail(m){
  activeMovie=m;resetCommentEditor();
  const localViews=recordLocalView(m.id);
  recordCineMovieView(m).then(()=>{
    if(activeMovie?.id===m.id && m.popularViews==null){
      $("#detailViews").textContent='전체 인기순 집계에 반영되었습니다. 방문자별 하루 1회 집계됩니다.';
    }
  }).catch(error=>{
    if(activeMovie?.id===m.id){
      $("#detailViews").textContent=`인기순 집계 연결 실패: ${error.message}`;
    }
  });
  $("#detailPoster").innerHTML=m.poster?`<img src="${esc(m.poster)}" alt="${esc(m.title)} 포스터">`:`<div class="fallback">${esc(m.title)}</div>`;
  $("#detailTitle").textContent=m.title||'';
  $("#detailMeta").textContent=[m.year,m.genre].filter(Boolean).join(' · ');
  $("#detailRatings").innerHTML=`<div class="score">TMDB <strong>${m.tmdb??'—'}</strong> <span class="hint">(${(m.tmdbVotes||0).toLocaleString()}명)</span></div><div class="score">IMDb <strong>${m.imdb??'—'}</strong> <span class="hint">${m.imdbVotes?`(${esc(m.imdbVotes)}명)`:''}</span></div>`;
  $("#detailReview").textContent=m.review||'한 줄평 정보가 없습니다.';
  $("#providers").innerHTML=`<div class="provider-group"><div class="provider-label">구독</div>${providerHtml(m.providers?.subscription,m)}</div><div class="provider-group"><div class="provider-label">대여</div>${providerHtml(m.providers?.rent,m)}</div><div class="provider-group"><div class="provider-label">구매</div>${providerHtml(m.providers?.buy,m)}</div>`;
  $("#detailViews").textContent=m.popularViews!=null
    ? `전체 ${Number(m.popularViews).toLocaleString()}회 조회 · ${localViews}회 이 브라우저에서 열람`
    : `인기순 집계는 방문자별 하루 1회 기록됩니다. (이 브라우저 ${localViews}회 열람)`;
  $("#modal").classList.add('show');$("#modal").setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
  loadComments();
}
function closeDetail(){$("#modal").classList.remove('show');$("#modal").setAttribute('aria-hidden','true');document.body.style.overflow='';}
let emptyMessage='영화가 없습니다.';

async function loadPopularity(period){
  const labels={weekly:'주간 인기',monthly:'월간 인기',alltime:'누적 인기'};
  $("#error").innerHTML='';
  $("#status").textContent=`${labels[period]} 순위를 불러오는 중입니다.`;
  emptyMessage='아직 조회 기록이 없습니다. 영화 상세정보를 열면 인기순 데이터가 쌓입니다.';
  try{
    await ensureCommentAuth();
    const {data,error}=await supabaseClient.rpc('get_cine_popular_movies',{
      p_period:period,
      p_limit:50
    });
    if(error) throw error;
    movies=(data||[]).map(row=>({
      ...(row.movie_data||{}),
      id:Number(row.movie_id),
      popularViews:Number(row.view_count||0)
    }));
    render();
    $("#status").textContent=`${labels[period]} TOP ${movies.length} · ${period==='weekly'?'최근 7일':period==='monthly'?'이번 달':'전체 기간'} 기준`;
  }catch(error){
    movies=[];
    emptyMessage='인기순 데이터를 불러오지 못했습니다.';
    render();
    $("#status").textContent='인기순 연결 실패';
    $("#error").innerHTML=`<div class="error">${esc(error.message)}<br><span class="hint">Supabase에서 popularity_setup.sql을 실행했는지, Anonymous Sign-Ins가 켜져 있는지 확인하세요.</span></div>`;
  }
}

async function load(){
  const mode=currentMode;
  if(['weekly','monthly','alltime'].includes(mode)){
    await loadPopularity(mode);
    return;
  }

  $("#error").innerHTML='';
  const q=$("#query").value.trim();
  const isSearch=mode==='search' || Boolean(q);
  if(isSearch && !q){
    $("#status").textContent='검색할 영화 제목을 입력하세요.';
    $("#query").focus();
    return;
  }

  emptyMessage='영화가 없습니다.';
  $("#status").textContent=isSearch?'영화를 검색하고 있습니다.':'추천순 영화를 불러오는 중입니다.';
  const url=new URL(`${SUPABASE_URL}/functions/v1/${FUNCTION_NAME}`);
  url.searchParams.set('mode',isSearch?'search':'discover');
  if(isSearch) url.searchParams.set('query',q);
  try{
    const r=await fetch(url,{headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:`Bearer ${SUPABASE_PUBLISHABLE_KEY}`,Accept:'application/json'}});
    const data=await r.json().catch(()=>({}));
    if(!r.ok||data.success===false)throw new Error(data.error||`API 오류 ${r.status}`);
    movies=data.results||[];
    render();
    $("#status").textContent=isSearch?`${movies.length}편의 검색 결과입니다.`:`추천순 영화 ${movies.length}편을 불러왔습니다.`;
  }catch(e){
    movies=[];render();$("#status").textContent='API 연결 실패';
    $("#error").innerHTML=`<div class="error">API 연결 실패: ${esc(e.message)}<br><span class="hint">Supabase hyper-processor와 TMDB 인증 설정을 확인하세요.</span></div>`;
  }
}

function setActiveMode(mode){
  currentMode=mode;
  document.querySelectorAll('#modeTabs .mode-tab').forEach(button=>{
    const active=button.dataset.mode===mode;
    button.classList.toggle('active',active);
    button.setAttribute('aria-pressed',String(active));
  });
}

$("#modeTabs").addEventListener('click',event=>{
  const button=event.target.closest('button[data-mode]');
  if(!button) return;
  const mode=button.dataset.mode;
  setActiveMode(mode);
  if(mode==='search'){
    $("#status").textContent='검색할 영화 제목을 입력한 뒤 검색 버튼을 누르세요.';
    $("#query").focus();
    return;
  }
  $("#query").value='';
  load();
});

$("#searchBtn").addEventListener('click',()=>{
  setActiveMode('search');
  load();
});
$("#query").addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    setActiveMode('search');
    load();
  }
});
$("#commentForm").addEventListener('submit',submitComment);
$("#commentList").addEventListener('click',handleCommentAction);
$("#cancelCommentEdit").addEventListener('click',resetCommentEditor);
$("#closeBtn").addEventListener('click',closeDetail);$("#modal").addEventListener('click',e=>{if(e.target.id==='modal')closeDetail()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});
load();
</script>
</body>
</html>
