<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CINE PICK</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0c10;
  color: #fff;
  font-family: Arial, "Noto Sans KR", sans-serif;
}

header {
  padding: 28px 5%;
  border-bottom: 1px solid #252730;
  background: #0b0c10;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 30px;
  font-weight: 900;
}

.subtitle {
  color: #999;
  margin-top: 6px;
  font-size: 13px;
}

.controls {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

input,
select,
button {
  border: 1px solid #30333b;
  background: #15171d;
  color: white;
  border-radius: 9px;
  padding: 12px;
}

input {
  flex: 1;
  min-width: 200px;
}

button {
  cursor: pointer;
}

button:hover {
  background: #252832;
}

main {
  width: 90%;
  max-width: 1400px;
  margin: 30px auto;
}

.status {
  color: #aaa;
  font-size: 13px;
  margin-bottom: 20px;
}

.error {
  background: #351719;
  border: 1px solid #74343a;
  color: #ffb5b5;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 20px;
  display: none;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 22px;
}

.card {
  background: #121419;
  border: 1px solid #252830;
  border-radius: 13px;
  overflow: hidden;
}

.poster {
  aspect-ratio: 2 / 3;
  background: linear-gradient(135deg, #252936, #111318);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #777;
  font-size: 12px;
}

.poster img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.info {
  padding: 13px;
}

.title {
  font-weight: bold;
  line-height: 1.4;
}

.meta {
  color: #999;
  font-size: 12px;
  margin-top: 5px;
}

.ratings {
  display: flex;
  gap: 6px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.rating {
  border: 1px solid #353842;
  border-radius: 20px;
  padding: 5px 8px;
  font-size: 11px;
}

.ott {
  color: #aaa;
  font-size: 11px;
  margin-top: 10px;
  line-height: 1.5;
}

@media(max-width:600px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  main {
    width: 94%;
  }

  .controls {
    flex-wrap: wrap;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">CINE PICK</div>
  <div class="subtitle">한국 OTT 영화 탐색</div>

  <div class="controls">
    <input
      id="search"
      type="text"
      placeholder="영화 제목을 검색하세요"
    >

    <select id="mode">
      <option value="discover">추천</option>
      <option value="popular">인기</option>
      <option value="top">TMDB 평점</option>
      <option value="new">최신</option>
    </select>

    <button onclick="loadMovies()">검색</button>
  </div>
</header>

<main>

  <div id="status" class="status">
    영화 정보를 불러오는 중...
  </div>

  <div id="error" class="error"></div>

  <div id="grid" class="grid"></div>

</main>

<script>

/* ==============================
   SUPABASE 설정
============================== */

const SUPABASE_URL =
  "https://nxrohsvtcckarurkpull.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_TjNFFVWTyk1ERcjhdCKLAw_v21E0WTF";

/*
  현재 Supabase에서 만든 Edge Function 이름
*/
const FUNCTION_NAME = "hyper-processor";


/* ==============================
   HTML 요소
============================== */

const searchInput = document.getElementById("search");
const modeSelect = document.getElementById("mode");
const grid = document.getElementById("grid");
const statusBox = document.getElementById("status");
const errorBox = document.getElementById("error");


/* ==============================
   영화 불러오기
============================== */

async function loadMovies() {

  errorBox.style.display = "none";
  errorBox.textContent = "";

  statusBox.textContent = "영화 정보를 불러오는 중...";

  grid.innerHTML = "";

  try {

    if (
      SUPABASE_PUBLISHABLE_KEY.includes("여기에_본인의")
    ) {
      throw new Error(
        "Supabase Publishable key가 입력되지 않았습니다."
      );
    }

    const url =
      `${SUPABASE_URL}/functions/v1/${FUNCTION_NAME}`;

    const requestUrl = new URL(url);

    requestUrl.searchParams.set(
      "mode",
      modeSelect.value
    );

    const query = searchInput.value.trim();

    if (query) {
      requestUrl.searchParams.set("query", query);
    }

    const response = await fetch(
      requestUrl.toString(),
      {
        method: "GET",

        headers: {
          "apikey": SUPABASE_PUBLISHABLE_KEY,
          "Authorization":
            `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
          "Content-Type": "application/json"
        }
      }
    );

    const text = await response.text();

    let data;

    try {
      data = JSON.parse(text);
    } catch {
      throw new Error(
        `Supabase 응답 오류 (${response.status})`
      );
    }

    if (!response.ok) {
      throw new Error(
        data.error ||
        `API 오류 (${response.status})`
      );
    }

    if (data.success === false) {
      throw new Error(
        data.error ||
        "영화 데이터를 가져오지 못했습니다."
      );
    }

    const movies = data.results || [];

    renderMovies(movies);

    statusBox.textContent =
      `${movies.length}편의 영화를 불러왔습니다.`;

  } catch (error) {

    console.error(error);

    statusBox.textContent = "API 연결 실패";

    errorBox.style.display = "block";

    errorBox.textContent =
      `API 연결 실패: ${error.message}`;
  }
}


/* ==============================
   영화 카드
============================== */

function renderMovies(movies) {

  if (!movies.length) {

    grid.innerHTML = `
      <div style="
        color:#999;
        padding:40px 0;
      ">
        검색 결과가 없습니다.
      </div>
    `;

    return;
  }

  grid.innerHTML = movies.map(movie => {

    const poster = movie.poster
      ? `<img
           src="${escapeHTML(movie.poster)}"
           alt="${escapeHTML(movie.title || "")}"
           loading="lazy"
         >`
      : "POSTER";

    const subscription =
      movie.providers?.subscription || [];

    const rent =
      movie.providers?.rent || [];

    const buy =
      movie.providers?.buy || [];

    const ottNames = [
      ...subscription,
      ...rent,
      ...buy
    ]
      .map(item => item.name)
      .filter(Boolean);

    const uniqueOTT = [
      ...new Set(ottNames)
    ];

    return `
      <article class="card">

        <div class="poster">
          ${poster}
        </div>

        <div class="info">

          <div class="title">
            ${escapeHTML(
              movie.title || "제목 없음"
            )}
          </div>

          <div class="meta">
            ${escapeHTML(movie.year || "")}
            ${movie.genre ? " · " + escapeHTML(movie.genre) : ""}
          </div>

          <div class="ratings">

            <span class="rating">
              TMDB
              ${movie.tmdb ?? "평점 없음"}
            </span>

            <span class="rating">
              IMDb
              ${movie.imdb ?? "평점 없음"}
            </span>

          </div>

          <div class="meta">
            TMDB 평가
            ${Number(movie.tmdbVotes || 0).toLocaleString()}
            명

            ${
              movie.imdbVotes
                ? ` · IMDb ${escapeHTML(
                    String(movie.imdbVotes)
                  )}명`
                : ""
            }
          </div>

          ${
            uniqueOTT.length
              ? `
                <div class="ott">
                  한국 OTT:
                  ${escapeHTML(
                    uniqueOTT.join(", ")
                  )}
                </div>
              `
              : `
                <div class="ott">
                  한국 OTT 정보 없음
                </div>
              `
          }

        </div>

      </article>
    `;

  }).join("");
}


/* ==============================
   HTML 문자 보호
============================== */

function escapeHTML(value) {

  return String(value).replace(
    /[&<>"']/g,
    character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[character])
  );

}


/* ==============================
   검색
============================== */

searchInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {
      loadMovies();
    }

  }
);


/* ==============================
   최초 실행
============================== */

loadMovies();

</script>

</body>
</html>
