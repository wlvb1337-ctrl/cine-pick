<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CINE PICK</title>
<style>
:root{--bg:#090b10;--p:#141821;--p2:#1c2230;--t:#f4f5f8;--m:#98a1b3;--g:#e7b75a;--l:#2a3140}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,Pretendard,"Noto Sans KR",sans-serif}header{padding:30px 5vw 25px;border-bottom:1px solid var(--l);background:linear-gradient(135deg,#171d2a,#090b10)}.brand{color:var(--g);font-weight:900;letter-spacing:.3em;font-size:13px}.hero{margin-top:20px}.hero h1{font-size:clamp(32px,5vw,56px);margin:0}.hero p{color:var(--m)}main{max-width:1400px;margin:auto;padding:24px 4vw 60px}.notice{background:#2b2417;border:1px solid #5d4b28;color:#e7d6ac;padding:12px;border-radius:10px;font-size:12px;line-height:1.6;margin-bottom:18px}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.toolbar input,.toolbar select{background:var(--p);border:1px solid var(--l);color:var(--t);padding:12px;border-radius:10px}.toolbar input{flex:1;min-width:220px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{background:var(--p);border:1px solid var(--l);color:var(--t);padding:10px 14px;border-radius:999px;cursor:pointer}.tab.active{background:var(--g);color:#15120b;font-weight:800}.head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 14px}.muted{color:var(--m);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;overflow:hidden}.poster{height:305px;background:linear-gradient(145deg,#33495d,#8e6a4e);position:relative}.poster img{width:100%;height:100%;object-fit:cover}.fallback{height:100%;display:flex;align-items:end;padding:18px;font-size:26px;font-weight:900}.year,.rank{position:absolute;top:12px;background:#0009;border-radius:20px;padding:5px 8px;font-size:12px}.year{right:12px}.rank{left:12px;color:var(--g);font-weight:900}.body{padding:14px}.body h3{margin:0 0 6px}.meta{font-size:12px;color:var(--m)}.ratings{display:flex;gap:7px;margin:11px 0}.rating{background:var(--p2);padding:7px 9px;border-radius:8px;font-size:12px}.rating b{color:var(--g);font-size:14px}.review{border-left:2px solid var(--g);padding-left:10px;font-size:13px;line-height:1.5;margin:12px 0}.providers{border-top:1px solid var(--l);padding-top:10px;font-size:12px;line-height:1.8;color:var(--m)}.tag{border:1px solid #3b4658;border-radius:999px;padding:2px 7px;margin:2px;display:inline-block}.btn{width:100%;background:var(--g);border:0;padding:10px;border-radius:9px;cursor:pointer;font-weight:800}.empty{grid-column:1/-1;text-align:center;padding:40px;color:var(--m);background:var(--p);border-radius:14px}footer{margin-top:30px;border-top:1px solid var(--l);padding-top:18px;color:var(--m);font-size:12px;line-height:1.7}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.poster{height:240px}.body{padding:10px}}
</style></head><body>
<header><div class="brand">CINE PICK</div><div class="hero"><h1>오늘의 영화를 발견하다.</h1><p>TMDB · IMDb · 한국 OTT 정보를 한곳에서.</p></div></header>
<main><div class="notice">1차 API 연동 구조입니다. TMDB/OMDb 비밀키는 이 HTML에 넣지 않고 Supabase Edge Function에서 사용합니다.</div>
<div class="toolbar"><input id="search" placeholder="영화 제목 검색"><select id="sort"><option value="popular">인기순</option><option value="rating">TMDB 평점순</option><option value="year">최신 개봉순</option></select></div>
<nav class="tabs"><button class="tab active" data-mode="discover">추천 영화</button><button class="tab" data-mode="week">주간 인기</button><button class="tab" data-mode="month">월간 인기</button><button class="tab" data-mode="total">누적 인기</button></nav>
<div class="head"><h2 id="title">추천 영화</h2><span class="muted" id="status">연결 준비 중</span></div><section id="grid" class="grid"></section>
<footer>다음 단계: Supabase 프로젝트 생성 → Edge Function 배포 → Secrets 등록 → 댓글/조회수 DB 연결.</footer></main>
<script>
const SUPABASE_URL="https://nxrohsvtcckarurkpull.supabase.co",SUPABASE_ANON_KEY="sb_publishable_TjNFFVWTyk1ERcjhdCKLAw_v21E0WTF";
const state={mode:"discover",movies:[]},$=s=>document.querySelector(s);
async function load(){if(SUPABASE_URL.startsWith("YOUR_")){demo();return}$("#status").textContent="불러오는 중…";try{let u=new URL(SUPABASE_URL+"/functions/v1/movie-data");u.searchParams.set("mode",state.mode);let q=$("#search").value.trim();if(q)u.searchParams.set("query",q);let r=await fetch(u,{headers:{apikey:SUPABASE_ANON_KEY}});if(!r.ok)throw Error(r.status);state.movies=await r.json();$("#status").textContent=state.movies.length+"편";render()}catch(e){$("#status").textContent="API 연결 실패";demo()}}
function demo(){state.movies=[{id:278,title:"쇼생크 탈출",year:1994,genre:"드라마",tmdb:null,imdb:null,poster:null,review:"희망은 가장 어두운 곳에서도 사라지지 않는다는 이야기.",providers:[]},{id:238,title:"대부",year:1972,genre:"범죄 · 드라마",tmdb:null,imdb:null,poster:null,review:"가족과 권력의 이름으로 펼쳐지는 장대한 비극.",providers:[]},{id:155,title:"다크 나이트",year:2008,genre:"액션 · 범죄",tmdb:null,imdb:null,poster:null,review:"영웅과 악당의 경계를 집요하게 묻는 슈퍼히어로 영화.",providers:[]},{id:157336,title:"인터스텔라",year:2014,genre:"SF · 드라마",tmdb:null,imdb:null,poster:null,review:"우주적 스케일 속에 담아낸 사랑과 선택의 이야기.",providers:[]}];render()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){let q=$("#search").value.trim().toLowerCase(),a=state.movies.filter(x=>x.title.toLowerCase().includes(q)),s=$("#sort").value;if(s==="rating")a.sort((x,y)=>(y.tmdb??-1)-(x.tmdb??-1));if(s==="year")a.sort((x,y)=>(y.year??0)-(x.year??0));$("#grid").innerHTML=a.length?a.map((m,i)=>`<article class="card"><div class="poster">${m.poster?`<img src="${esc(m.poster)}" alt="${esc(m.title)} 포스터">`:`<div class="fallback">${esc(m.title)}</div>`}<span class="year">${m.year??""}</span>${state.mode!=="discover"?`<span class="rank">#${i+1}</span>`:""}</div><div class="body"><h3>${esc(m.title)}</h3><div class="meta">${m.year??""} · ${esc(m.genre||"")}</div><div class="ratings"><span class="rating">IMDb <b>${m.imdb??"—"}</b></span><span class="rating">TMDB <b>${m.tmdb??"—"}</b></span></div><div class="review">${esc(m.review)}</div><div class="providers">${m.providers?.length?m.providers.map(x=>`<span class="tag">${esc(x.name)} · ${esc(x.type||"")}</span>`).join(""):"<span class='tag'>OTT 정보 없음</span>"}</div><button class="btn" onclick="recordView(${m.id})">영화 보기</button></div></article>`).join(""):'<div class="empty">검색 결과가 없습니다.</div>'}
async function recordView(id){if(SUPABASE_URL.startsWith("YOUR_"))return;try{await fetch(SUPABASE_URL+"/functions/v1/movie-view",{method:"POST",headers:{"Content-Type":"application/json",apikey:SUPABASE_ANON_KEY},body:JSON.stringify({movie_id:id})})}catch(e){}}
$("#search").addEventListener("input",load);$("#sort").addEventListener("change",render);
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{state.mode=b.dataset.mode;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));$("#title").textContent={discover:"추천 영화",week:"주간 인기",month:"월간 인기",total:"누적 인기"}[state.mode];load()}));load();
</script></body></html>
